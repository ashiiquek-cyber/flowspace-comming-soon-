<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ECEBE5" />
    <title>Flowspace Architects — Architecture & Interior Design Studio | Wayanad & Bengaluru</title>
    <meta name="description" content="Flowspace Architects designs climate-responsive homes, resorts and interiors from Wayanad and Bengaluru, with light, air, water and courtyards flowing through every plan." />
    <!-- The body face is self-hosted (see src/index.css); fetch it alongside the CSS, not after it -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/hanken-grotesk-latin-wght-normal.woff2" crossorigin />
    <style>
      /* Static first frame of the home hero, painted before any JavaScript runs. It matches the
         hero's opening state (the limewash ground with the intro line bottom left; the tower model and
         the emblem fade in after) and sits outside #root, so React never deletes it: the opaque <main>
         simply paints over it, and src/main.tsx removes it a few seconds later. A node removed
         straight away would be dropped as the largest contentful paint, handing that to the app's
         copy, painted only after all the JavaScript has run. */
      .hero-shell { position: absolute; top: 0; left: 0; width: 100%; z-index: 1; height: 100vh; height: 100svh; overflow: hidden; background: #ecebe5; }
      .hero-shell p { position: absolute; left: 1.5rem; bottom: 24px; max-width: 30ch; margin: 0; color: #1d201e;
        font: 400 13px/1.4 'Hanken Grotesk', system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
      @media (min-width: 768px) { .hero-shell p { left: 2.5rem; bottom: 32px; max-width: 34ch; } }
    </style>
  </head>
  <body class="bg-lime text-ink antialiased">
    <div id="root"></div>
    <script>
      (function () {
        var h = location.hash.replace(/^#\/?/, '');
        if (h && !/^(home)?$/.test(h.split('/')[0])) return;
        if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
        document.getElementById('root').insertAdjacentHTML('beforebegin',
          '<section id="hero-shell" class="hero-shell" aria-hidden="true">' +
          '<p>Architecture, interiors and landscape from Kalpetta, Wayanad and Jayanagar, Bengaluru. Led by Chief Architect Ar.&nbsp;Rashid&nbsp;Ali.</p>' +
          '</section>');
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
